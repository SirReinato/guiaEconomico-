<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#820ad1" />
      <stop offset="50%" stop-color="#64109c" />
      <stop offset="100%" stop-color="#00b3ff" />
    </linearGradient>

    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#820ad1" />
      <stop offset="70%" stop-color="#00b3ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00b3ff" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Fundo do emblema: Squircle com borda em gradiente -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#brandGrad)" />
  <rect x="7.5" y="7.5" width="85" height="85" rx="22.5" fill="#060f1a" />

  <!-- Círculo interior sutil de bússola/radar -->
  <circle
    cx="50"
    cy="50"
    r="32"
    stroke="rgba(0, 179, 255, 0.18)"
    stroke-width="1.5"
    stroke-dasharray="4 4"
  />

  <!-- Barras financeiras ascendentes -->
  <rect x="26" y="58" width="7.5" height="18" rx="3.75" fill="#820ad1" opacity="0.7" />
  <rect x="38.5" y="48" width="7.5" height="28" rx="3.75" fill="#64109c" opacity="0.9" />
  <rect x="51" y="38" width="7.5" height="38" rx="3.75" fill="#00b3ff" opacity="0.92" />
  <rect x="63.5" y="28" width="7.5" height="48" rx="3.75" fill="#00b3ff" />

  <!-- Linha de tendência com flecha -->
  <path
    d="M25 52 L39 42 L51 47 L68 22"
    stroke="url(#trendGrad)"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />
  <path
    d="M58.5 22 H68 V31.5"
    stroke="#ffffff"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Ponto de luz no ápice -->
  <circle cx="68" cy="22" r="3.2" fill="#ffffff" filter="url(#neonGlow)" />

  <!-- Cifrão no topo esquerdo -->
  <text
    x="23"
    y="29"
    fill="rgba(0, 179, 255, 0.9)"
    font-size="14"
    font-weight="900"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  >
    $
  </text>
</svg>
