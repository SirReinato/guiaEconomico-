<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Offline – Guia Econômico</title>
  <style>
    body { display:flex; align-items:center; justify-content:center; height:100vh; margin:0; font-family:sans-serif; background:#fafafa; }
    .msg { text-align:center; }
  </style>
</head>
<body>
  <div class="msg">
    <h1>🚧 Offline</h1>
    <p>Você está sem conexão. Algumas funcionalidades (ex.: dados de reserva) não estão disponíveis.</p>
    <p>Conecte‑se à internet e recarregue a página.</p>
  </div>
  <script>
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
          if (window.caches) {
            caches.keys().then(function(names) {
              for (var j = 0; j < names.length; j++) caches.delete(names[j]);
              setTimeout(function() { window.location.href = '/'; }, 300);
            });
          } else {
            setTimeout(function() { window.location.href = '/'; }, 300);
          }
        });
      }
    }
  </script>
</body>
</html>
